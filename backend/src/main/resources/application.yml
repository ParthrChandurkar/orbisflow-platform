spring:
  application:
    name: orbisflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbisflow}
    username: ${DB_USERNAME:orbisflow}
    password: ${DB_PASSWORD:orbisflow_local}

server:
  port: ${SERVER_PORT:8080}

orbisflow:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
