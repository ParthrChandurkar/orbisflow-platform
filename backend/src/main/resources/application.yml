spring:
  application:
    name: orbisflow-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbisflow}
    username: ${DB_APP_USERNAME:orbisflow_app}
    password: ${DB_APP_PASSWORD:orbisflow_app_local}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbisflow}
    user: ${DB_MIGRATION_USERNAME:orbisflow}
    password: ${DB_MIGRATION_PASSWORD:orbisflow_local}
    placeholders:
      applicationDatabasePassword: ${DB_APP_PASSWORD:orbisflow_app_local}
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

orbisflow:
  auth:
    jwt-secret: ${JWT_SECRET:b3JiaXNmbG93LWxvY2FsLWp3dC1zZWNyZXQtbXVzdC1iZS0zMi1ieXRlcw==}
    csrf-secret: ${CSRF_SECRET:b3JiaXNmbG93LWxvY2FsLWNzcmYtc2VjcmV0LW11c3QtYmUtMzItYnl0ZXM=}
    jwt-ttl: PT8H
    secure-cookies: ${SECURE_COOKIES:true}
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: PT2S
    read-timeout: PT60S
  storage:
    s3:
      bucket: ${S3_BUCKET:orbisflow-invoices}
      region: ${AWS_REGION:us-east-1}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      path-style: ${S3_PATH_STYLE:false}
      signed-link-secret: ${SIGNED_LINK_SECRET:b3JiaXNmbG93LWxvY2FsLXNpZ25lZC1saW5rLXNlY3JldC0zMi1ieXRlcw==}
      signed-link-ttl: PT60S
