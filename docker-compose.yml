services:
  frontend:
    build:
      context: ./frontend
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-orbisflow}
      DB_MIGRATION_USERNAME: ${POSTGRES_USER:-orbisflow}
      DB_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD:-orbisflow_local}
      DB_APP_USERNAME: ${DB_APP_USERNAME:-orbisflow_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-orbisflow_app_local}
      JWT_SECRET: ${JWT_SECRET:-b3JiaXNmbG93LWxvY2FsLWp3dC1zZWNyZXQtbXVzdC1iZS0zMi1ieXRlcw==}
      CSRF_SECRET: ${CSRF_SECRET:-b3JiaXNmbG93LWxvY2FsLWNzcmYtc2VjcmV0LW11c3QtYmUtMzItYnl0ZXM=}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_BASE_URL: http://ai-service:8000
      S3_BUCKET: ${S3_BUCKET:-orbisflow-invoices}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-orbisflow_local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-orbisflow_local_secret}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      SIGNED_LINK_SECRET: ${SIGNED_LINK_SECRET:-b3JiaXNmbG93LWxvY2FsLXNpZ25lZC1saW5rLXNlY3JldC0zMi1ieXRlcw==}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  ai-service:
    build:
      context: ./ai-service
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbisflow}
      POSTGRES_USER: ${POSTGRES_USER:-orbisflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbisflow_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbisflow_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbisflow_local_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbisflow_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbisflow_local_secret}
      S3_BUCKET: ${S3_BUCKET:-orbisflow-invoices}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
